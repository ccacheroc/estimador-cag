[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador de presupuestos de software basado en IA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.14.0",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.64.0",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "app",
    "tests",
]
exclude = [
    ".venv",
    "**/__pycache__",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
