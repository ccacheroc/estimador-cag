# Índice propio del proyecto; no es un formato nativo de Codex ni de Copilot.
# schema_version versiona este esquema local, no una especificación externa.
# Todas las rutas son relativas a la raíz del repositorio.
schema_version: "1.0"
entrypoint: AGENTS.md
canonical_root: .agents
manifest_path: .agents/manifest.yaml

directories:
  rules: .agents/rules
  workflows: .agents/workflows
  skills: .agents/skills
  agents: .agents/agents
  hooks: .agents/hooks
  templates: .agents/templates

loading:
  # AGENTS.md y este manifest se leen antes de estas categorías.
  order:
    - rules
    - workflows
    - skills
    - agents
    - hooks
    - templates
  scope: relevant_to_current_task
  missing_reference_policy: >-
    Informar de toda referencia a un fichero inexistente. Si el fichero es
    necesario para continuar conforme a AGENTS.md, detener la parte dependiente
    y solicitar el dato o documento que falta. No inventar su contenido.

# Registrar únicamente documentos existentes, con identificadores únicos.
# Cada entrada usa: id, path y description.
# Añadir applies_to cuando ayude a seleccionar el documento por tarea.
# Un inventario vacío significa que todavía no se han registrado documentos;
# no prueba que la carpeta esté vacía. Inspeccionarla antes de concluirlo.
inventory:
  rules:
    - id: agent-housekeeping
      path: .agents/rules/agent-housekeeping.md
      description: Mantenimiento de archivos auxiliares y consistencia del README.
    - id: architecture
      path: .agents/rules/architecture.md
      description: Límites de capas y evolución arquitectónica del estimador CAG.
    - id: techstack
      path: .agents/rules/techstack.md
      description: Uso exclusivo de uv para gestión de dependencias, entornos y ejecución.
    - id: communication-style
      path: .agents/rules/communication-style.md
      description: Comunicación concisa y resumen obligatorio al finalizar cada tarea.
    - id: consistency-check-for-agents-changes
      path: .agents/rules/consistency-check-for-agents-changes.md
      description: Verificación de coherencia entre las especificaciones agénticas.
    - id: task-change-commit-prompt
      path: .agents/rules/task-change-commit-prompt.md
      description: Solicita confirmación antes de crear un commit al cambiar de tarea.
    - id: testing
      path: .agents/rules/testing.md
      description: Criterios y comandos de validación del proyecto.
  workflows:
    - id: abrir-sesion
      path: .agents/workflows/abrir-sesion.md
      description: Iniciar nuevo requisito con commit/push previo, PR opcional y creación de rama.
      applies_to:
        - session_start
    - id: cerrar-sesion
      path: .agents/workflows/cerrar-sesion.md
      description: Finalizar sesión con commit, push y PR opcional.
      applies_to:
        - session_end
  skills:
    - id: governance-check
      path: .agents/skills/governance-check/SKILL.md
      description: Clasificación y validación de artefactos de configuración agéntica.
    - id: skill-creator
      path: .agents/skills/skill-creator/SKILL.md
      description: Creación, mejora y evaluación de skills de Codex.
    - id: product-owner-prd
      path: .agents/skills/product-owner-prd/SKILL.md
      description: Creación, revisión, actualización y reconciliación de PRD con producto, código y tests.
  agents: []
  hooks: []
  templates:
    - id: completion-report
      path: .agents/templates/completion-report.md
      description: Informe final con cambios, comandos, validación y pendientes.
      applies_to:
        - task_completion

# Describe las ubicaciones; no configura ni activa las herramientas.
tool_support:
  codex:
    instructions: AGENTS.md
    skills_directory: .agents/skills
    instruction_bridge: null
  claude_code:
    instructions: AGENTS.md
    skills_directory: .agents/skills
    instruction_bridge: .claude/CLAUDE.md
  cursor:
    instructions: AGENTS.md
    skills_directory: .agents/skills
    instruction_bridge: .cursor/rules/agents.mdc
  gemini_cli:
    instructions: AGENTS.md
    skills_directory: .agents/skills
    instruction_bridge: .gemini/settings.json
  github_copilot_vscode:
    instructions: AGENTS.md
    skills_directory: .agents/skills
    instruction_bridge: .github/copilot-instructions.md

validation:
  # Completar cuando el stack y los comandos estén documentados.
  # Cada entrada usa: id, command, working_directory y applies_to.
  commands: []
