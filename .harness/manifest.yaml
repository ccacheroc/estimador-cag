# Índice propio del proyecto; no es un formato nativo de Codex ni de Copilot.
# schema_version versiona este esquema local, no una especificación externa.
# Todas las rutas son relativas a la raíz del repositorio.
schema_version: "1.0"
entrypoint: AGENTS.md
canonical_root: .harness
manifest_path: .harness/manifest.yaml

directories:
  rules: .harness/rules
  workflows: .harness/workflows
  skills: .harness/skills
  agents: .harness/agents
  hooks: .harness/hooks
  templates: .harness/templates

loading:
  # AGENTS.md y este manifest se leen antes de estas categorías.
  order:
    - rules
    - workflows
    - skills
    - agents
    - hooks
    - templates
  scope: relevant_to_current_task
  missing_reference_policy: >-
    Informar de toda referencia a un fichero inexistente. Si el fichero es
    necesario para continuar conforme a AGENTS.md, detener la parte dependiente
    y solicitar el dato o documento que falta. No inventar su contenido.

# Registrar únicamente documentos existentes, con identificadores únicos.
# Cada entrada usa: id, path y description.
# Añadir applies_to cuando ayude a seleccionar el documento por tarea.
# Un inventario vacío significa que todavía no se han registrado documentos;
# no prueba que la carpeta esté vacía. Inspeccionarla antes de concluirlo.
inventory:
  rules:
    - id: agent-housekeeping
      path: .harness/rules/agent-housekeeping.md
      description: Mantenimiento de archivos auxiliares y consistencia del README.
    - id: backend-standards
      path: .harness/rules/backend-standards.md
      description: Convenciones de capas, contratos, integraciones y verificación del backend.
      applies_to:
        - backend_development
    - id: code-quality-standards
      path: .harness/rules/code-quality-standards.md
      description: Tipado completo, nomenclatura y criterios para crear abstracciones compartidas.
      applies_to:
        - code_change
    - id: frontend-standards
      path: .harness/rules/frontend-standards.md
      description: Convenciones de presentación, estado, errores y verificación del frontend.
      applies_to:
        - frontend_development
    - id: language-standards
      path: .harness/rules/language-standards.md
      description: Idioma canónico de código, pruebas, configuración, documentación y commits.
      applies_to:
        - code_change
        - documentation
        - git
    - id: uv-dependency-management
      path: .harness/rules/uv-dependency-management.md
      description: Uso exclusivo de uv para gestionar dependencias, entornos, bloqueos y ejecución.
    - id: technology-standards
      path: .harness/rules/technology-standards.md
      description: Tecnologías autorizadas y criterios para evolucionar el stack del proyecto.
    - id: communication-style
      path: .harness/rules/communication-style.md
      description: Comunicación concisa y resumen obligatorio al finalizar cada tarea.
    - id: ponytail
      path: .harness/rules/ponytail.md
      description: Exige la solución mínima segura y delega los flujos en la skill Ponytail.
    - id: ai-specs-and-rule-evolution
      path: .harness/rules/ai-specs-and-rule-evolution.md
      description: Captura de feedback, evolución gobernada y verificación de consistencia de especificaciones.
    - id: task-change-commit-prompt
      path: .harness/rules/task-change-commit-prompt.md
      description: Solicita confirmación antes de crear un commit al cambiar de tarea.
    - id: testing-standards
      path: .harness/rules/testing-standards.md
      description: Criterios transversales de alcance, aislamiento, fronteras y ejecución de pruebas.
      applies_to:
        - code_change
        - testing
  workflows:
    - id: abrir-sesion
      path: .harness/workflows/abrir-sesion.md
      description: Iniciar nuevo requisito con commit/push previo, PR opcional y creación de rama.
      applies_to:
        - session_start
    - id: cerrar-sesion
      path: .harness/workflows/cerrar-sesion.md
      description: Finalizar sesión con commit, push y PR opcional.
      applies_to:
        - session_end
  skills:
    - id: adversarial-review
      path: .harness/skills/adversarial-review/SKILL.md
      description: Revisión adversarial independiente de cambios OpenSpec antes de archivarlos.
      applies_to:
        - adversarial_review
        - openspec_verification
    - id: governance-check
      path: .harness/skills/governance-check/SKILL.md
      description: Clasificación y validación de artefactos de configuración agéntica.
    - id: ponytail
      path: .harness/skills/ponytail/SKILL.md
      description: Enruta implementación mínima, revisión, auditoría, deuda, benchmark y ayuda de Ponytail.
    - id: skill-creator
      path: .harness/skills/skill-creator/SKILL.md
      description: Creación, mejora y evaluación de skills de Codex.
    - id: product-owner-prd
      path: .harness/skills/product-owner-prd/SKILL.md
      description: Creación, revisión, actualización y reconciliación de PRD con producto, código y tests.
  agents:
    - id: product-strategy-analyst
      path: .harness/agents/product-strategy-analyst.md
      description: Análisis estratégico de producto basado en la skill product-owner-prd.
      applies_to:
        - product_strategy
        - ideation
        - product_discovery
    - id: backend-developer
      path: .harness/agents/backend-developer.md
      description: Desarrollo, contratos y verificación del backend FastAPI, servicios CAG y revisión de documentación técnica.
      applies_to:
        - backend_development
        - api_design
        - llm_integration
        - testing
    - id: frontend-developer
      path: .harness/agents/frontend-developer.md
      description: Desarrollo, estado de sesión, UI Streamlit, tests con Playwright y revisión de documentación técnica.
      applies_to:
        - frontend_development
        - ui_design
        - e2e_testing
        - testing
    - id: qa-analyst
      path: .harness/agents/qa-analyst.md
      description: Aseguramiento de calidad, deep testing, auditoría de código, revisión adversarial y validación de contratos.
      applies_to:
        - quality_assurance
        - testing
        - code_auditing
        - adversarial_review
        - contract_verification
  hooks: []
  templates:
    - id: completion-report
      path: .harness/templates/completion-report.md
      description: Informe final con cambios, comandos, validación y pendientes.
      applies_to:
        - task_completion

# Describe las ubicaciones; no configura ni activa las herramientas.
tool_support:
  codex:
    instructions: AGENTS.md
    skills_directory: .harness/skills
    instruction_bridge: null
  claude_code:
    instructions: AGENTS.md
    skills_directory: .harness/skills
    instruction_bridge: .claude/CLAUDE.md
  cursor:
    instructions: AGENTS.md
    skills_directory: .harness/skills
    instruction_bridge: .cursor/rules/agents.mdc
  gemini_cli:
    instructions: AGENTS.md
    skills_directory: .harness/skills
    instruction_bridge: .gemini/settings.json
  github_copilot_vscode:
    instructions: AGENTS.md
    skills_directory: .harness/skills
    instruction_bridge: .github/copilot-instructions.md
  antigravity:
    instructions: AGENTS.md
    skills_directory: .agent/skills
    instruction_bridge: .agent/rules/agents.md

validation:
  # Cada entrada usa: id, command, working_directory y applies_to.
  commands:
    - id: pyright
      command: uv run --no-sync pyright
      working_directory: .
      applies_to:
        - code_change
    - id: test
      command: uv run pytest
      working_directory: .
      applies_to:
        - code_change
        - testing
    - id: test-e2e
      command: uv run pytest tests/e2e
      working_directory: .
      applies_to:
        - testing
