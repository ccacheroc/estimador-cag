name: Validación del estimador

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Instalar dependencias bloqueadas
        run: uv sync --locked
      - name: Validar estructura y comportamiento
        run: uv run --no-sync python -m unittest discover -s tests -v
